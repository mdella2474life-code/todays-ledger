<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Today's Ledger</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1E2A3A" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<meta name="mobile-web-app-capable" content="yes" />

<style>
  html, body, #root { height: 100%; margin: 0; padding: 0; background: #1E2A3A; }
  body { overscroll-behavior-y: none; }
</style>

<!-- React + ReactDOM -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<!-- Babel standalone so the browser can run JSX directly, no build step -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<!-- Recharts (charts) -->
<script src="https://unpkg.com/prop-types@15/prop-types.min.js" crossorigin></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js" crossorigin></script>
<!-- Lucide icons (React components, UMD build) -->
<script src="https://unpkg.com/lucide-react@0.383.0/dist/umd/lucide-react.js" crossorigin></script>
</head>
<body>
<div id="root"></div>

<script>
  // window.storage shim backed by localStorage so the app works as a
  // standalone static site (no Claude artifact runtime available here).
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys };
    }
  };
</script>

<script>
  fetch('app.js')
    .then((res) => res.text())
    .then((code) => {
      const transformed = Babel.transform(code, { presets: ['react'] }).code;
      const script = document.createElement('script');
      script.text = transformed;
      document.body.appendChild(script);
    })
    .catch((err) => {
      document.getElementById('root').innerHTML =
        '<p style="color:#F6F2E9;font-family:system-ui;padding:20px;">Failed to load app.js: ' + err.message + '</p>';
    });
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
